<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비사이로 막가</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: #0b1020;
        color: #e8f2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, #1b2c52, #060910 70%);
      }

      .game {
        width: min(960px, 100%);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .game__header h1 {
        margin: 0 0 4px;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .game__header p {
        margin: 0;
        color: #c4d4f3;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        background: rgba(10, 16, 33, 0.7);
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 600;
      }

      .stage {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(180deg, #0b1b3a, #050610);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        background: rgba(8, 10, 20, 0.8);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .overlay--visible {
        opacity: 1;
        pointer-events: auto;
      }

      .overlay h2,
      .result h2 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.1rem);
      }

      .overlay p,
      .result p {
        margin: 0;
        color: #d0ddf5;
      }

      .menu,
      .result {
        display: none;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .menu--active,
      .result--active {
        display: flex;
      }

      .menu__actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .countdown {
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      button {
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        background: #62d2ff;
        color: #0b1020;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(98, 210, 255, 0.25);
      }

      button:hover {
        background: #8be0ff;
      }

      .button--ghost {
        background: transparent;
        color: #e8f2ff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: none;
      }

      .button--ghost:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .game__footer {
        color: #9eb2d6;
        text-align: right;
      }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(5, 8, 16, 0.75);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .modal--open {
        opacity: 1;
        pointer-events: auto;
      }

      .modal__content {
        width: min(520px, 100%);
        background: #0e1426;
        border-radius: 16px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      }

      .modal__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal__header h3 {
        margin: 0;
      }

      .modal__close {
        background: transparent;
        color: #cfe1ff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: none;
      }

      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 240px;
        overflow-y: auto;
      }

      .history-list li {
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        color: #d9e6ff;
        font-size: 0.95rem;
      }

      .history-list span {
        color: #7fd3ff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="game">
      <header class="game__header">
        <h1>비사이로 막가</h1>
        <p>어릴 적 장난스러운 말처럼, 비 사이를 터치로 피해보세요.</p>
      </header>

      <div class="hud">
        <div>점수: <span id="score">0</span></div>
        <div>최고기록: <span id="best">0</span></div>
      </div>

      <div class="stage">
        <canvas id="rain-canvas" aria-label="비사이로 막가 게임 화면"></canvas>
        <div id="overlay" class="overlay overlay--visible">
          <div id="menu" class="menu">
            <h2>비사이로 막가</h2>
            <p>비사이를 터치로 피하고 최대한 오래 버텨보세요.</p>
            <div class="menu__actions">
              <button id="start" type="button">게임 시작</button>
              <button id="history" type="button" class="button--ghost">기록 보기</button>
            </div>
          </div>
          <div id="countdown" class="countdown" aria-live="polite"></div>
          <div id="result" class="result">
            <h2>비를 맞았어요!</h2>
            <p>다시 시작해서 비사이를 가볍게 통과해봐요.</p>
            <div class="menu__actions">
              <button id="restart" type="button">다시 도전</button>
              <button id="history-from-result" type="button" class="button--ghost">기록 보기</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="game__footer">
        <p>팁: 화면 어디를 터치해도 캐릭터가 따라갑니다.</p>
      </footer>
    </div>

    <div id="history-modal" class="modal" aria-hidden="true" role="dialog">
      <div class="modal__content">
        <div class="modal__header">
          <h3>나의 기록</h3>
          <button id="close-history" class="modal__close" type="button">닫기</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("rain-canvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start");
      const restartButton = document.getElementById("restart");
      const historyButton = document.getElementById("history");
      const historyFromResultButton = document.getElementById("history-from-result");
      const menu = document.getElementById("menu");
      const countdownEl = document.getElementById("countdown");
      const resultPanel = document.getElementById("result");
      const historyModal = document.getElementById("history-modal");
      const historyList = document.getElementById("history-list");
      const closeHistory = document.getElementById("close-history");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      const state = {
        running: false,
        drops: [],
        player: {
          x: 0,
          y: 0,
          width: 50,
          height: 16,
        },
        lastTime: 0,
        spawnTimer: 0,
        score: 0,
        best: 0,
        speedMultiplier: 1,
        dropsDodged: 0,
        speedBonus: 0,
        difficultyTier: 0,
        countdownTimer: null,
        countdownValue: 5,
        history: [],
      };

      const safeStorage = {
        getItem(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        },
        setItem(key, value) {
          try {
            window.localStorage.setItem(key, value);
          } catch (error) {
            return;
          }
        },
      };

      const bestScoreKey = "rain-run-best";
      const historyKey = "rain-run-history";
      state.best = Number.parseFloat(safeStorage.getItem(bestScoreKey)) || 0;
      state.history = JSON.parse(safeStorage.getItem(historyKey) || "[]");

      const settings = {
        spawnInterval: 520,
        minDropSpeed: 220,
        maxDropSpeed: 420,
        dropWidthRange: [12, 22],
        dropHeight: 36,
        speedStep: 0.04,
        spawnScale: 0.2,
        maxExtraDrops: 3,
      };

      const showMenu = () => {
        menu.classList.add("menu--active");
        resultPanel.classList.remove("result--active");
        countdownEl.textContent = "";
      };

      const showResult = () => {
        menu.classList.remove("menu--active");
        resultPanel.classList.add("result--active");
        countdownEl.textContent = "";
      };

      const showCountdown = (value) => {
        menu.classList.remove("menu--active");
        resultPanel.classList.remove("result--active");
        countdownEl.textContent = value;
      };

      const resizeCanvas = () => {
        const { width, height } = canvas.getBoundingClientRect();
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        state.player.y = height - 40;
        state.player.x = width / 2 - state.player.width / 2;
      };

      const resetGame = () => {
        state.drops = [];
        state.score = 0;
        state.speedMultiplier = 1;
        state.spawnTimer = 0;
        state.dropsDodged = 0;
        state.speedBonus = 0;
        state.difficultyTier = 0;
        state.lastTime = performance.now();
        updateScore();
      };

      const updateScore = () => {
        scoreEl.textContent = Math.floor(state.score);
        bestEl.textContent = Math.floor(state.best);
      };

      const startCountdown = () => {
        if (state.countdownTimer) {
          clearInterval(state.countdownTimer);
        }
        overlay.classList.add("overlay--visible");
        state.countdownValue = 5;
        showCountdown(state.countdownValue);
        state.countdownTimer = setInterval(() => {
          state.countdownValue -= 1;
          if (state.countdownValue <= 0) {
            clearInterval(state.countdownTimer);
            state.countdownTimer = null;
            overlay.classList.remove("overlay--visible");
            startGame();
            return;
          }
          showCountdown(state.countdownValue);
        }, 1000);
      };

      const startGame = () => {
        state.running = true;
        resetGame();
        requestAnimationFrame(loop);
      };

      const endGame = () => {
        state.running = false;
        state.best = Math.max(state.best, state.score);
        safeStorage.setItem(bestScoreKey, String(state.best));
        const runRecord = {
          score: Math.floor(state.score),
          drops: state.dropsDodged,
          date: new Date().toLocaleString(),
        };
        state.history.unshift(runRecord);
        state.history = state.history.slice(0, 20);
        safeStorage.setItem(historyKey, JSON.stringify(state.history));
        updateScore();
        overlay.classList.add("overlay--visible");
        showResult();
      };

      const spawnDrop = () => {
        const { width } = canvas.getBoundingClientRect();
        const dropWidth =
          settings.dropWidthRange[0] +
          Math.random() *
            (settings.dropWidthRange[1] - settings.dropWidthRange[0]);
        state.drops.push({
          x: Math.random() * (width - dropWidth),
          y: -settings.dropHeight,
          width: dropWidth,
          height: settings.dropHeight,
          speed:
            settings.minDropSpeed +
            Math.random() * (settings.maxDropSpeed - settings.minDropSpeed),
        });
      };

      const update = (delta) => {
        state.spawnTimer += delta;
        state.score += delta * 0.01;
        state.difficultyTier = Math.floor(state.score / 100);
        state.speedBonus = Math.pow(state.difficultyTier, 2) * settings.speedStep;
        state.speedMultiplier = 1 + state.score / 120 + state.speedBonus;
        const intervalScale = 1 + state.difficultyTier * settings.spawnScale;
        const spawnInterval = settings.spawnInterval / intervalScale;

        if (state.spawnTimer > spawnInterval) {
          state.spawnTimer -= spawnInterval;
          spawnDrop();
          const extraDrops = Math.min(state.difficultyTier, settings.maxExtraDrops);
          for (let i = 0; i < extraDrops; i += 1) {
            spawnDrop();
          }
        }

        state.drops.forEach((drop) => {
          drop.y += (drop.speed * state.speedMultiplier * delta) / 1000;
        });

        const { height } = canvas.getBoundingClientRect();
        state.drops = state.drops.filter((drop) => {
          if (drop.y < height) {
            return true;
          }
          state.dropsDodged += 1;
          return false;
        });
      };

      const checkCollision = () => {
        const { player } = state;
        return state.drops.some((drop) => {
          const dropBottom = drop.y + drop.height;
          const playerBottom = player.y + player.height;
          return (
            drop.x < player.x + player.width &&
            drop.x + drop.width > player.x &&
            dropBottom > player.y &&
            drop.y < playerBottom
          );
        });
      };

      const drawBackground = () => {
        const { width, height } = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#0d2247");
        gradient.addColorStop(1, "#04060c");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      };

      const drawDrops = () => {
        ctx.fillStyle = "#5fc9ff";
        state.drops.forEach((drop) => {
          ctx.fillRect(drop.x, drop.y, drop.width, drop.height);
        });
      };

      const drawPlayer = () => {
        const { player } = state;
        ctx.fillStyle = "#ffe96b";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "#2c3050";
        ctx.fillRect(player.x + player.width * 0.4, player.y - 14, 8, 14);
      };

      const loop = (time) => {
        if (!state.running) return;
        const delta = time - state.lastTime;
        state.lastTime = time;

        update(delta);
        drawBackground();
        drawDrops();
        drawPlayer();
        updateScore();

        if (checkCollision()) {
          endGame();
          return;
        }

        requestAnimationFrame(loop);
      };

      const handleMove = (event) => {
        if (!state.running) return;
        const { width } = canvas.getBoundingClientRect();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        state.player.x = Math.max(
          0,
          Math.min(width - state.player.width, x - state.player.width / 2)
        );
      };

      const renderHistory = () => {
        historyList.innerHTML = "";
        if (!state.history.length) {
          const emptyItem = document.createElement("li");
          emptyItem.textContent = "아직 기록이 없어요.";
          historyList.appendChild(emptyItem);
          return;
        }
        state.history.forEach((record) => {
          const item = document.createElement("li");
          item.innerHTML = `<div>${record.date}</div><span>${record.score}점 · ${record.drops}회</span>`;
          historyList.appendChild(item);
        });
      };

      const openHistory = () => {
        renderHistory();
        historyModal.classList.add("modal--open");
        historyModal.setAttribute("aria-hidden", "false");
      };

      const closeHistoryModal = () => {
        historyModal.classList.remove("modal--open");
        historyModal.setAttribute("aria-hidden", "true");
      };

      window.addEventListener("resize", resizeCanvas);

      canvas.addEventListener("mousemove", handleMove);
      canvas.addEventListener("touchmove", handleMove, { passive: true });
      startButton.addEventListener("click", startCountdown);
      startButton.addEventListener("touchstart", startCountdown, { passive: true });
      restartButton.addEventListener("click", startCountdown);
      restartButton.addEventListener("touchstart", startCountdown, { passive: true });
      historyButton.addEventListener("click", openHistory);
      historyFromResultButton.addEventListener("click", openHistory);
      closeHistory.addEventListener("click", closeHistoryModal);
      historyModal.addEventListener("click", (event) => {
        if (event.target === historyModal) {
          closeHistoryModal();
        }
      });

      resizeCanvas();
      updateScore();
      showMenu();
    </script>
  </body>
</html>
