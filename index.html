<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비사이로 막가</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: #0b1020;
        color: #e8f2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, #1b2c52, #060910 70%);
      }

      .game {
        width: min(960px, 100%);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .game__header h1 {
        margin: 0 0 4px;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .game__header p {
        margin: 0;
        color: #c4d4f3;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        background: rgba(10, 16, 33, 0.7);
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 600;
      }

      .stage {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(180deg, #0b1b3a, #050610);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        background: rgba(8, 10, 20, 0.8);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .overlay--visible {
        opacity: 1;
        pointer-events: auto;
      }

      .overlay h2 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.1rem);
      }

      .overlay p {
        margin: 0;
        color: #d0ddf5;
      }

      button {
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        background: #62d2ff;
        color: #0b1020;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(98, 210, 255, 0.25);
      }

      button:hover {
        background: #8be0ff;
      }

      .game__footer {
        color: #9eb2d6;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="game">
      <header class="game__header">
        <h1>비사이로 막가</h1>
        <p>어릴 적 장난스러운 말처럼, 비 사이를 터치로 피해보세요.</p>
      </header>

      <div class="hud">
        <div>점수: <span id="score">0</span></div>
        <div>최고기록: <span id="best">0</span></div>
      </div>

      <div class="stage">
        <canvas id="rain-canvas" aria-label="비사이로 막가 게임 화면"></canvas>
        <div id="overlay" class="overlay overlay--visible">
          <h2>터치로 이동!</h2>
          <p>비사이를 빠르게 피해서 최대한 오래 버텨보세요.</p>
          <button id="start" type="button">시작하기</button>
        </div>
      </div>

      <footer class="game__footer">
        <p>팁: 화면 어디를 터치해도 캐릭터가 따라갑니다.</p>
      </footer>
    </div>

    <script>
      const canvas = document.getElementById("rain-canvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      const state = {
        running: false,
        drops: [],
        player: {
          x: 0,
          y: 0,
          width: 50,
          height: 16,
        },
        lastTime: 0,
        spawnTimer: 0,
        score: 0,
        best: 0,
        speedMultiplier: 1,
      };

      const safeStorage = {
        getItem(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        },
        setItem(key, value) {
          try {
            window.localStorage.setItem(key, value);
          } catch (error) {
            return;
          }
        },
      };

      const bestScoreKey = "rain-run-best";
      state.best = Number.parseFloat(safeStorage.getItem(bestScoreKey)) || 0;

      const settings = {
        spawnInterval: 520,
        minDropSpeed: 220,
        maxDropSpeed: 420,
        dropWidthRange: [12, 22],
        dropHeight: 36,
      };

      const resizeCanvas = () => {
        const { width, height } = canvas.getBoundingClientRect();
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        state.player.y = height - 40;
        state.player.x = width / 2 - state.player.width / 2;
      };

      const resetGame = () => {
        state.drops = [];
        state.score = 0;
        state.speedMultiplier = 1;
        state.spawnTimer = 0;
        state.lastTime = performance.now();
        updateScore();
      };

      const updateScore = () => {
        scoreEl.textContent = Math.floor(state.score);
        bestEl.textContent = Math.floor(state.best);
      };

      const startGame = () => {
        overlay.querySelector("h2").textContent = "터치로 이동!";
        overlay.querySelector("p").textContent =
          "비사이를 빠르게 피해서 최대한 오래 버텨보세요.";
        startButton.textContent = "시작하기";
        overlay.classList.remove("overlay--visible");
        state.running = true;
        resetGame();
        requestAnimationFrame(loop);
      };

      const endGame = () => {
        state.running = false;
        state.best = Math.max(state.best, state.score);
        safeStorage.setItem(bestScoreKey, String(state.best));
        updateScore();
        overlay.classList.add("overlay--visible");
        overlay.querySelector("h2").textContent = "비를 맞았어요!";
        overlay.querySelector("p").textContent =
          "다시 시작해서 비사이를 가볍게 통과해봐요.";
        startButton.textContent = "다시 도전";
      };

      const spawnDrop = () => {
        const { width } = canvas.getBoundingClientRect();
        const dropWidth =
          settings.dropWidthRange[0] +
          Math.random() *
            (settings.dropWidthRange[1] - settings.dropWidthRange[0]);
        state.drops.push({
          x: Math.random() * (width - dropWidth),
          y: -settings.dropHeight,
          width: dropWidth,
          height: settings.dropHeight,
          speed:
            settings.minDropSpeed +
            Math.random() * (settings.maxDropSpeed - settings.minDropSpeed),
        });
      };

      const update = (delta) => {
        state.spawnTimer += delta;
        state.score += delta * 0.01;
        state.speedMultiplier = 1 + state.score / 120;

        if (state.spawnTimer > settings.spawnInterval) {
          state.spawnTimer = 0;
          spawnDrop();
        }

        state.drops.forEach((drop) => {
          drop.y += (drop.speed * state.speedMultiplier * delta) / 1000;
        });

        const { height } = canvas.getBoundingClientRect();
        state.drops = state.drops.filter((drop) => drop.y < height);
      };

      const checkCollision = () => {
        const { player } = state;
        return state.drops.some((drop) => {
          const dropBottom = drop.y + drop.height;
          const playerBottom = player.y + player.height;
          return (
            drop.x < player.x + player.width &&
            drop.x + drop.width > player.x &&
            dropBottom > player.y &&
            drop.y < playerBottom
          );
        });
      };

      const drawBackground = () => {
        const { width, height } = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#0d2247");
        gradient.addColorStop(1, "#04060c");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      };

      const drawDrops = () => {
        ctx.fillStyle = "#5fc9ff";
        state.drops.forEach((drop) => {
          ctx.fillRect(drop.x, drop.y, drop.width, drop.height);
        });
      };

      const drawPlayer = () => {
        const { player } = state;
        ctx.fillStyle = "#ffe96b";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "#2c3050";
        ctx.fillRect(player.x + player.width * 0.4, player.y - 14, 8, 14);
      };

      const loop = (time) => {
        if (!state.running) return;
        const delta = time - state.lastTime;
        state.lastTime = time;

        update(delta);
        drawBackground();
        drawDrops();
        drawPlayer();
        updateScore();

        if (checkCollision()) {
          endGame();
          return;
        }

        requestAnimationFrame(loop);
      };

      const handleMove = (event) => {
        if (!state.running) return;
        const { width } = canvas.getBoundingClientRect();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        state.player.x = Math.max(
          0,
          Math.min(width - state.player.width, x - state.player.width / 2)
        );
      };

      window.addEventListener("resize", resizeCanvas);

      canvas.addEventListener("mousemove", handleMove);
      canvas.addEventListener("touchmove", handleMove, { passive: true });
      startButton.addEventListener("click", startGame);
      startButton.addEventListener("touchstart", startGame, { passive: true });

      resizeCanvas();
      updateScore();
    </script>
  </body>
</html>
